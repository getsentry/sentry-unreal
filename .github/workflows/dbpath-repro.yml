# Temporary diagnostic workflow (PR #1511).
#
# Manually-dispatchable job that packages the sample on Windows with a chosen
# staging mode (loose / pak / pak+compressed), then runs the packaged exe with
# `-init-only` right after the build and prints the `[DBPATH]` log line emitted
# by FGenericPlatformSentrySubsystem::GetDatabasePath().
#
# It answers: does ConvertToAbsolutePathForExternalAppForWrite diverge from
# ConvertRelativePathToFull (equal=0) in a real Windows compressed-pak build?
#
# Requires the temporary `[DBPATH]` UE_LOG in GenericPlatformSentrySubsystem.cpp.
# Remove this file and that log once the question is settled.
name: DBPath Repro (manual)

on:
  # Runs on push to the repro branch (workflow_dispatch is unavailable until the
  # workflow lands on the default branch). On push, inputs are empty and the
  # expressions below fall back to their defaults (5.8 / pak-compressed).
  push:
    branches:
      - dbpath-repro-ci
  workflow_dispatch:
    inputs:
      unreal-version:
        description: Unreal Engine version (docker image tag)
        required: true
        default: "5.8"
        type: string
      staging:
        description: How to stage the packaged build
        required: true
        default: pak-compressed
        type: choice
        options:
          - pak-compressed
          - pak
          - loose

env:
  REGISTRY: ghcr.io

jobs:
  repro:
    name: DBPath repro (Win64, ${{ inputs.staging || 'pak-compressed' }})
    runs-on: windows-latest-unreal
    timeout-minutes: 90
    env:
      UNREAL_VERSION: ${{ inputs.unreal-version || '5.8' }}
      STAGING: ${{ inputs.staging || 'pak-compressed' }}

    steps:
      - name: Log in to GitHub package registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # Fetch prebuilt SDK binaries from the latest successful CI run (no SDK rebuild),
      # then materialize the plugin as REAL files under sample/Plugins/sentry. A junction
      # (what init-win.ps1 creates) would not resolve inside the Docker container because
      # its absolute target path differs from the mounted volume layout.
      - name: Provision plugin
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/init-win.ps1
          $link = "sample/Plugins/sentry"
          $item = Get-Item $link -Force
          if ($item.LinkType -eq 'Junction') { $item.Delete() }
          Copy-Item -Path plugin-dev -Destination $link -Recurse -Force

      - name: Start Docker container
        run: |
          docker run -td `
            --name unreal `
            --volume "${{ github.workspace }}:C:/workspace" `
            --workdir C:/workspace `
            ghcr.io/getsentry/unreal-docker:"${env:UNREAL_VERSION}"

      - name: Build and stage sample
        shell: pwsh
        run: |
          $flags = @('-nop4','-cook','-iterate','-build','-stage','-package')
          switch ($env:STAGING) {
            'pak-compressed' { $flags += @('-pak','-compressed') }
            'pak'            { $flags += '-pak' }
            'loose'          { }
          }
          Write-Host "BuildCookRun staging flags: $($flags -join ' ')"
          docker exec unreal C:\UnrealEngine\Engine\Build\BatchFiles\RunUAT.bat BuildCookRun `
            -project=C:/workspace/sample/SentryPlayground.uproject `
            -platform=Win64 `
            -clientconfig=Development `
            @flags
          if ($LASTEXITCODE -ne 0) { throw "BuildCookRun failed ($LASTEXITCODE)" }

      # `-init-only` initializes the SDK (which calls GetDatabasePath) and exits.
      # DSN is committed in sample/Config/DefaultEngine.ini, so no secret is needed.
      - name: Run packaged exe (init-only)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\sample\Saved\StagedBuilds" -Recurse -Filter SentryPlayground.exe |
                 Where-Object { $_.FullName -notmatch 'Editor' } | Select-Object -First 1
          if (-not $exe) { throw "Staged SentryPlayground.exe not found" }
          $rel = $exe.FullName.Substring($env:GITHUB_WORKSPACE.Length).Replace('\','/').TrimStart('/')
          $dockerExe = "C:/workspace/$rel"
          Write-Host "Running: $dockerExe"
          docker exec unreal powershell -Command "& '$dockerExe' -init-only -unattended -nosplash -nullrhi -stdout -FullStdOutLogOutput -NoLoadingScreen 2>&1 | Tee-Object -FilePath C:/workspace/dbpath-run.log"

      - name: Report [DBPATH]
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE\dbpath-run.log"
          $hits = @()
          if (Test-Path $log) { $hits += (Select-String -Path $log -Pattern '\[DBPATH\]' | ForEach-Object { $_.Line }) }
          if (-not $hits) {
            $hits += (Get-ChildItem "$env:GITHUB_WORKSPACE\sample\Saved\StagedBuilds" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
                      ForEach-Object { Select-String -Path $_.FullName -Pattern '\[DBPATH\]' -ErrorAction SilentlyContinue } |
                      ForEach-Object { $_.Line })
          }
          if (-not $hits) { throw "[DBPATH] line not found in logs" }
          $hits | ForEach-Object { Write-Host $_ }
          "## DBPath repro ($env:STAGING)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```'                                     | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $hits                                      | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```'                                     | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: dbpath-repro-logs (${{ inputs.unreal-version || '5.8' }}, ${{ inputs.staging || 'pak-compressed' }})
          path: |
            dbpath-run.log
            sample/Saved/StagedBuilds/**/Saved/Logs/*.log
          include-hidden-files: true
          if-no-files-found: warn
