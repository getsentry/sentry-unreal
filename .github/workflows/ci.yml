  integration-test-linux:
    needs: [test-linux, generate-test-matrix]
    # TEMP(debug/ue427-linux-hang): repeated runs; the hang is intermittent (~1 in 3).
    name: Linux UE ${{ matrix.unreal }} (${{ matrix.backend }}) run ${{ matrix.run }}
    secrets:
      SENTRY_UNREAL_TEST_DSN: ${{ secrets.SENTRY_UNREAL_TEST_DSN }}
      SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        unreal: ${{ fromJSON(needs.generate-test-matrix.outputs.linux) }}
        backend: [crashpad, native]
        run: [1, 2, 3]
    uses: ./.github/workflows/integration-test-linux.yml
    with:
      unreal-version: ${{ matrix.unreal }}
      backend: ${{ matrix.backend }}
      run-index: ${{ matrix.run }}

