name: CI

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  android-sdk:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Android
      runsOn: ubuntu-latest

  ios-sdk:
    uses: ./.github/workflows/sdk-download.yml
    with:
      target: IOS
      runsOn: macos-latest

  macos-cocoa-sdk:
    uses: ./.github/workflows/sdk-download.yml
    with:
      target: Mac
      backend: cocoa
      runsOn: macos-latest

  macos-native-sdk:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Mac
      backend: native
      runsOn: macos-15

  linux-sdk-crashpad:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Linux
      backend: crashpad
      runsOn: ubuntu-latest
      container: ubuntu:20.04

  linux-sdk-native:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Linux
      backend: native
      runsOn: ubuntu-latest
      container: ubuntu:20.04

  linux-arm64-sdk-crashpad:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: LinuxArm64
      backend: crashpad
      runsOn: ubuntu-22.04-arm
      container: arm64v8/ubuntu:20.04

  linux-arm64-sdk-native:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: LinuxArm64
      backend: native
      runsOn: ubuntu-22.04-arm
      container: arm64v8/ubuntu:20.04

  windows-sdk-crashpad:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Win64
      backend: crashpad
      runsOn: windows-2022

  windows-sdk-native:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Win64
      backend: native
      runsOn: windows-2022

  windows-arm64-sdk-crashpad:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: WinArm64
      backend: crashpad
      runsOn: windows-11-arm

  windows-arm64-sdk-native:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: WinArm64
      backend: native
      runsOn: windows-11-arm

  package-preparation:
    needs: [android-sdk, ios-sdk, macos-cocoa-sdk, macos-native-sdk, linux-sdk-crashpad, linux-sdk-native, linux-arm64-sdk-crashpad, linux-arm64-sdk-native, windows-sdk-crashpad, windows-sdk-native, windows-arm64-sdk-crashpad, windows-arm64-sdk-native]
    name: Package
    runs-on: ubuntu-latest

    env:
      APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
      APPLE_CERT_PATH: ${{ runner.temp }}/certs.p12
      APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_key.json

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Download CLI
        shell: pwsh
        run: ./scripts/download-cli.ps1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Android-sdk
          path: plugin-dev/Source/ThirdParty/Android

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: IOS-sdk
          path: plugin-dev/Source/ThirdParty/IOS

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Mac-cocoa-sdk
          path: plugin-dev/Source/ThirdParty/Mac

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Mac-native-sdk
          path: plugin-dev/Source/ThirdParty/Mac/Native

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Linux-crashpad-sdk
          path: plugin-dev/Source/ThirdParty/Linux/Crashpad

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Linux-native-sdk
          path: plugin-dev/Source/ThirdParty/Linux/Native

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: LinuxArm64-crashpad-sdk
          path: plugin-dev/Source/ThirdParty/LinuxArm64/Crashpad

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: LinuxArm64-native-sdk
          path: plugin-dev/Source/ThirdParty/LinuxArm64/Native

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Win64-crashpad-sdk
          path: plugin-dev/Source/ThirdParty/Win64/Crashpad

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Win64-native-sdk
          path: plugin-dev/Source/ThirdParty/Win64/Native

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: WinArm64-crashpad-sdk
          path: plugin-dev/Source/ThirdParty/WinArm64/Crashpad

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: WinArm64-native-sdk
          path: plugin-dev/Source/ThirdParty/WinArm64/Native

      - name: Download Crash Reporter
        shell: bash
        run: ./scripts/download-crash-reporter.sh

      # Workaround for https://github.com/actions/download-artifact/issues/14
      # Adding execute permission for crashpad before preparing final packages
      # allows to avoid issues with plugin initialization on Unix-based systems.
      - name: Set permissions for executables
        shell: pwsh
        run: |
          chmod +x plugin-dev/Source/ThirdParty/Linux/Crashpad/bin/crashpad_handler
          chmod +x plugin-dev/Source/ThirdParty/Linux/Native/bin/sentry-crash
          chmod +x plugin-dev/Source/ThirdParty/LinuxArm64/Crashpad/bin/crashpad_handler
          chmod +x plugin-dev/Source/ThirdParty/LinuxArm64/Native/bin/sentry-crash
          chmod +x plugin-dev/Source/ThirdParty/Mac/Native/bin/sentry-crash

      - name: Install rcodesign
        if: env.APPLE_CERT_DATA != ''
        env:
          RCODESIGN_VERSION: 0.29.0
          RCODESIGN_CHECKSUM: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
        run: |
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o rcodesign.tar.gz
          echo "${RCODESIGN_CHECKSUM}  rcodesign.tar.gz" | sha256sum -c -
          tar -xz --strip-components=1 -f rcodesign.tar.gz rcodesign
          sudo mv rcodesign /usr/local/bin/rcodesign
          rm rcodesign.tar.gz

      - name: Sign macOS binaries
        if: env.APPLE_CERT_DATA != ''
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_DATA" | base64 --decode > "$APPLE_CERT_PATH"

          rcodesign sign --for-notarization \
            --p12-file "$APPLE_CERT_PATH" --p12-password "$APPLE_CERT_PASSWORD" \
            plugin-dev/Source/ThirdParty/Mac/Cocoa/bin/SentryObjC.dylib
          rcodesign sign --for-notarization \
            --p12-file "$APPLE_CERT_PATH" --p12-password "$APPLE_CERT_PASSWORD" \
            plugin-dev/Source/ThirdParty/Mac/Native/bin/sentry-crash

      - name: Notarize macOS binaries
        if: env.APPLE_CERT_DATA != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > "$APPLE_API_KEY_PATH"

          zip -j macos-binaries.zip \
            plugin-dev/Source/ThirdParty/Mac/Cocoa/bin/SentryObjC.dylib \
            plugin-dev/Source/ThirdParty/Mac/Native/bin/sentry-crash
          rcodesign notary-submit --wait \
            --api-key-file "$APPLE_API_KEY_PATH" \
            macos-binaries.zip
          rm macos-binaries.zip

      - name: Prepare Sentry packages for release
        shell: pwsh
        run: ./scripts/packaging/pack.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          # Artifact name is the commit sha. Which is what craft uses to find the relevant artifact.
          name: ${{ github.sha }}
          if-no-files-found: error
          path: |
            sentry-unreal-*.zip

  package-validation:
    needs: [package-preparation]
    name: Check snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ github.sha }}

      # If this step fails, you can accept the new file content by
      # running the following script locally with 'accept' as an argument
      # and committing the new snapshot file to your branch. i.e:
      # pwsh ./scripts/test-contents.ps1 accept
      - name: Verify package content against snapshot
        shell: pwsh
        run: ./scripts/packaging/test-contents.ps1

  # Resolves the engine-version matrix once for all test platforms. PRs run the legacy 4.27
  # (where supported) plus the 3 latest versions; pushes to main/release run the full set.
  generate-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.set-matrix.outputs.linux }}
      windows: ${{ steps.set-matrix.outputs.windows }}
      android: ${{ steps.set-matrix.outputs.android }}
    steps:
      - id: set-matrix
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ "$IS_PR" == "true" ]]; then
            # PRs: legacy 4.27 (where supported) + 3 latest
            echo 'linux=["4.27","5.6","5.7","5.8"]'   >> "$GITHUB_OUTPUT"
            echo 'windows=["4.27","5.6","5.7","5.8"]' >> "$GITHUB_OUTPUT"
            echo 'android=["5.6","5.7","5.8"]'        >> "$GITHUB_OUTPUT"
          else
            # main / release: full set
            echo 'linux=["4.27","5.2","5.3","5.4","5.5","5.6","5.7","5.8"]' >> "$GITHUB_OUTPUT"
            echo 'windows=["4.27","5.5","5.6","5.7","5.8"]'                 >> "$GITHUB_OUTPUT"
            echo 'android=["5.4","5.5","5.6","5.7","5.8"]'                  >> "$GITHUB_OUTPUT"
          fi

  test-linux:
    needs: [package-preparation, generate-test-matrix]
    name: Linux UE ${{ matrix.unreal }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    strategy:
      fail-fast: false
      matrix:
        unreal: ${{ fromJSON(needs.generate-test-matrix.outputs.linux) }}
    uses: ./.github/workflows/test-linux.yml
    with:
      unreal-version: ${{ matrix.unreal }}

  test-windows:
    needs: [package-preparation, generate-test-matrix]
    name: Windows UE ${{ matrix.unreal }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    strategy:
      fail-fast: false
      matrix:
        unreal: ${{ fromJSON(needs.generate-test-matrix.outputs.windows) }}
    uses: ./.github/workflows/test-windows.yml
    with:
      unreal-version: ${{ matrix.unreal }}

  test-macos:
    needs: [package-preparation]
    name: macOS UE ${{ matrix.unreal }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    strategy:
      fail-fast: false
      matrix:
        # Must match an engine version published to the registry by the ue-oci-macos workflow
        unreal: ['5.8']
    uses: ./.github/workflows/test-macos.yml
    with:
      unreal-version: ${{ matrix.unreal }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork

  test-android:
    needs: [package-preparation, generate-test-matrix]
    name: Android UE ${{ matrix.unreal }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    strategy:
      fail-fast: false
      matrix:
        unreal: ${{ fromJSON(needs.generate-test-matrix.outputs.android) }}
    uses: ./.github/workflows/test-android.yml
    with:
      unreal-version: ${{ matrix.unreal }}

  test-consoles:
    needs: [package-preparation]
    name: ${{ matrix.name }}
    if: github.event_name == 'push'
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: XSX (breakpad)
            platform: XSX
            backend: breakpad
            extension-repo: getsentry/sentry-xbox
            extension-artifact: scarlett-unreal
          - name: XSX (native)
            platform: XSX
            backend: native
            extension-repo: getsentry/sentry-xbox
            extension-artifact: scarlett-unreal-outproc
          - name: PS5
            platform: PS5
            backend: ""
            extension-repo: getsentry/sentry-playstation
            extension-artifact: ps5-unreal
          - name: Switch
            platform: Switch
            backend: ""
            extension-repo: getsentry/sentry-switch
            extension-artifact: nx64-unreal-sdk21
    uses: ./.github/workflows/test-consoles.yml
    with:
      platform: ${{ matrix.platform }}
      backend: ${{ matrix.backend }}
      extension-repo: ${{ matrix.extension-repo }}
      extension-artifact: ${{ matrix.extension-artifact }}

  integration-test-linux:
    needs: [test-linux, generate-test-matrix]
    name: Linux UE ${{ matrix.unreal }} (${{ matrix.backend }})
    secrets:
      SENTRY_UNREAL_TEST_DSN: ${{ secrets.SENTRY_UNREAL_TEST_DSN }}
      SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        unreal: ${{ fromJSON(needs.generate-test-matrix.outputs.linux) }}
        backend: [crashpad, native]
    uses: ./.github/workflows/integration-test-linux.yml
    with:
      unreal-version: ${{ matrix.unreal }}
      backend: ${{ matrix.backend }}

  integration-test-windows:
    needs: [test-windows, generate-test-matrix]
    name: Windows UE ${{ matrix.unreal }} (${{ matrix.backend }})
    secrets:
      SENTRY_UNREAL_TEST_DSN: ${{ secrets.SENTRY_UNREAL_TEST_DSN }}
      SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # Integration tests are supported only for UE 5.2 and newer where CRC can be disabled
        unreal: ${{ fromJSON(needs.generate-test-matrix.outputs.windows) }}
        backend: [crashpad, native]
        exclude:
          - unreal: '4.27'
    uses: ./.github/workflows/integration-test-windows.yml
    with:
      unreal-version: ${{ matrix.unreal }}
      backend: ${{ matrix.backend }}

  integration-test-macos:
    needs: [test-macos]
    name: macOS UE ${{ matrix.unreal }} (${{ matrix.backend }})
    secrets:
      SENTRY_UNREAL_TEST_DSN: ${{ secrets.SENTRY_UNREAL_TEST_DSN }}
      SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        unreal: ['5.8']
        backend: [cocoa, native]
    uses: ./.github/workflows/integration-test-macos.yml
    with:
      unreal-version: ${{ matrix.unreal }}
      backend: ${{ matrix.backend }}

  integration-test-android:
    needs: [test-android, generate-test-matrix]
    name: Android UE ${{ matrix.unreal }}
    secrets:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SENTRY_UNREAL_TEST_DSN: ${{ secrets.SENTRY_UNREAL_TEST_DSN }}
      SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        unreal: ${{ fromJSON(needs.generate-test-matrix.outputs.android) }}
    uses: ./.github/workflows/integration-test-android.yml
    with:
      unreal-version: ${{ matrix.unreal }}
