name: CI

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  android-sdk:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Android
      runsOn: ubuntu-latest

  ios-sdk:
    uses: ./.github/workflows/sdk-download.yml
    with:
      target: IOS
      runsOn: macos-latest

  macos-cocoa-sdk:
    uses: ./.github/workflows/sdk-download.yml
    with:
      target: Mac
      backend: cocoa
      runsOn: macos-latest

  macos-native-sdk:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Mac
      backend: native
      runsOn: macos-15

  linux-sdk-crashpad:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Linux
      backend: crashpad
      runsOn: ubuntu-latest
      container: ubuntu:20.04

  linux-sdk-native:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Linux
      backend: native
      runsOn: ubuntu-latest
      container: ubuntu:20.04

  linux-arm64-sdk-crashpad:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: LinuxArm64
      backend: crashpad
      runsOn: ubuntu-22.04-arm
      container: arm64v8/ubuntu:20.04

  linux-arm64-sdk-native:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: LinuxArm64
      backend: native
      runsOn: ubuntu-22.04-arm
      container: arm64v8/ubuntu:20.04

  windows-sdk-crashpad:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Win64
      backend: crashpad
      runsOn: windows-2022

  windows-sdk-native:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: Win64
      backend: native
      runsOn: windows-2022

  windows-arm64-sdk-crashpad:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: WinArm64
      backend: crashpad
      runsOn: windows-11-arm

  windows-arm64-sdk-native:
    uses: ./.github/workflows/sdk-build.yml
    with:
      target: WinArm64
      backend: native
      runsOn: windows-11-arm

  package:
    needs: [android-sdk, ios-sdk, macos-cocoa-sdk, macos-native-sdk, linux-sdk-crashpad, linux-sdk-native, linux-arm64-sdk-crashpad, linux-arm64-sdk-native, windows-sdk-crashpad, windows-sdk-native, windows-arm64-sdk-crashpad, windows-arm64-sdk-native]
    name: Package
    secrets:
      APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    uses: ./.github/workflows/package.yml

