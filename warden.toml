version = 1

# Layered on top of the org base config (getsentry/.github/warden.toml), which
# runs security-review and sets the model, effort, runtime, and incrementalApp.
# Repo skills inherit those execution defaults but not the base policy
# defaults, so the policy below repeats the org values to keep these skills
# non-blocking like the org baseline.
[defaults]
reportOn = "low"
failOn = "off"
failCheck = false
requestChanges = false

# Everything that ships with the plugin (runtime code, Build.cs, UPL, editor
# Python, post-build scripts, plugin config) plus the sample's C++ tests.
[[skills]]
name = "unreal-sdk-review"
incremental = true
paths = [
  "plugin-dev/**",
  "sample/Source/**",
]
ignorePaths = [
  "plugin-dev/Source/ThirdParty/**",
  "sample/Source/**/*.Build.cs",
  "sample/Source/*.Target.cs",
]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

# What does not ship: CI workflows, repo scripts, packaging snapshot, runner
# images, the sample project's build rules and config, and the Pester harness.
[[skills]]
name = "unreal-ci-review"
incremental = true
paths = [
  ".github/**",
  ".craft.yml",
  "scripts/**",
  "integration-test/**",
  "docker/**",
  "fastlane/**",
  "sample/*.uproject",
  "sample/Config/**",
  "sample/Source/**/*.Build.cs",
  "sample/Source/*.Target.cs",
]
ignorePaths = [
  "**/*.md",
]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
